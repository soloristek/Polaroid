<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LIFF 相框合成器</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入 LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- 引入 Fabric.js 處理 Canvas 影像 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>上傳照片合成相框</h2>
        
        <!-- 檔案上傳按鈕 -->
        <label for="imageUpload" class="upload-btn">選擇相簿照片</label>
        <input type="file" id="imageUpload" accept="image/*" style="display: none;">
        
        <!-- 畫布區域 -->
        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>
        <p class="hint">提示：可拖曳、雙指縮放或旋轉圖片</p>
        
        <!-- 送出按鈕 -->
        <button id="sendBtn" class="btn" disabled>合成並傳送至聊天室</button>
        <div id="loading" class="hidden">處理中，請稍候...</div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
